name: build

# Builds PRYSM (VST3, Windows x64, MSVC, Release), runs every test, builds the Windows installer (EXE),
# checks a silent install / uninstall on the runner, then publishes the artefacts.
# Artefacts are uploaded only if every previous step succeeded.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JUCE_TAG: "8.0.15"
  JUCE_COMMIT: "91ad83ae34a81e0833b1a2b0866f54846370ae53"
  PRYSM_VERSION: "1.1.0"

jobs:
  windows:
    name: Windows x64 (MSVC) - plug-in, tests, installer
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write   # only used to publish the GitHub Release on tags
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch JUCE (pinned tag + commit check)
        shell: pwsh
        run: |
          if (-not (Test-Path third_party/JUCE/CMakeLists.txt)) {
            git clone --branch $env:JUCE_TAG --depth 1 https://github.com/juce-framework/JUCE.git third_party/JUCE
            if ($LASTEXITCODE) { throw "git clone failed" }
          }
          $sha = (git -C third_party/JUCE rev-parse HEAD).Trim()
          if ($sha -ne $env:JUCE_COMMIT) { throw "JUCE commit mismatch: $sha (expected $env:JUCE_COMMIT)" }

      - name: Install NSIS 3
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          $v = (& makensis.exe /VERSION).Trim()
          Write-Host "makensis $v"
          if (-not $v.StartsWith("v3.")) { throw "NSIS 3.x required, found $v" }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPRYSM_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify the VST3 binary exists
        shell: pwsh
        run: |
          $dll = "build/PRYSM_artefacts/Release/VST3/PRYSM.vst3/Contents/x86_64-win/PRYSM.vst3"
          if (-not (Test-Path $dll)) { throw "VST3 binary missing: $dll" }
          $len = (Get-Item $dll).Length
          Write-Host "PRYSM.vst3 = $len bytes"
          if ($len -lt 1000000) { throw "VST3 binary suspiciously small ($len bytes)" }

      - name: Run tests (engine, processor, editor, VST3 host)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Vst3Dir build/PRYSM_artefacts/Release/VST3/PRYSM.vst3 -OutDir dist -Version $env:PRYSM_VERSION

      - name: Verify the installer exists
        shell: pwsh
        run: |
          $exe = "dist/PRYSM-$env:PRYSM_VERSION-Windows-x64-Setup.exe"
          if (-not (Test-Path $exe)) { throw "Installer missing: $exe" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "Installer suspiciously small" }

      - name: Silent install, host test on the installed plug-in, silent uninstall
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/PRYSM-$env:PRYSM_VERSION-Windows-x64-Setup.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          $bundle = Join-Path $env:CommonProgramW6432 "VST3\PRYSM.vst3"
          if (-not (Test-Path "$bundle\Contents\x86_64-win\PRYSM.vst3")) { throw "Not installed at $bundle" }
          $reg = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PRYSM"
          Write-Host "Registered: $($reg.DisplayName) $($reg.DisplayVersion)"
          & build/Tests/prysm_vst3_host_artefacts/Release/prysm_vst3_host.exe $bundle build/test_sample.wav
          if ($LASTEXITCODE) { throw "VST3 host test failed on the INSTALLED plug-in" }
          # '_?=' keeps the uninstaller in place so that -Wait really waits for it
          $u = Start-Process -FilePath "$env:ProgramW6432\PRYSM\Uninstall.exe" -ArgumentList "/S","_?=$env:ProgramW6432\PRYSM" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller exit code $($u.ExitCode)" }
          if (Test-Path $bundle) { throw "Uninstall left $bundle behind" }
          if (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PRYSM") { throw "Uninstall left its registry key" }
          Write-Host "install / host test / uninstall: OK"

      - name: Package the VST3 as a zip (manual install alternative)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/PRYSM_artefacts/Release/VST3/PRYSM.vst3 -DestinationPath "dist/PRYSM-$env:PRYSM_VERSION-VST3-Windows-x64.zip" -Force

      - name: Upload artefacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PRYSM-${{ env.PRYSM_VERSION }}-windows-x64
          path: |
            dist/PRYSM-${{ env.PRYSM_VERSION }}-Windows-x64-Setup.exe
            dist/PRYSM-${{ env.PRYSM_VERSION }}-VST3-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (version tags or manual run)
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$env:PRYSM_VERSION" }
          gh release create $tag `
            --target "${{ github.sha }}" `
            "dist/PRYSM-$env:PRYSM_VERSION-Windows-x64-Setup.exe" `
            "dist/PRYSM-$env:PRYSM_VERSION-VST3-Windows-x64.zip" `
            --title "PRYSM $tag" `
            --notes "Windows x64 installer (unsigned) and VST3 zip. Built and tested by CI. Not yet tested in FL Studio."
          if ($LASTEXITCODE) { throw "gh release create failed" }

  linux:
    name: Linux (Ubuntu 24.04) - plug-in and tests (cross-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb python3
      - name: Build and test
        run: ./scripts/build-linux.sh
